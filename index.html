<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conferência de NF</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--fg:#14232b;--mut:#5b6b73;--line:#d6dde1;--acc:#0b6b78;--acc-fg:#fff;--ok:#1b7a43;--okbg:#e2f3e8;--bad:#b3261e;--warn:#9a5b00;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#17262d;--fg:#e6eef1;--mut:#93a5ad;--line:#2b3d46;--acc:#4cc2d1;--acc-fg:#06242a;--ok:#6fd49a;--okbg:#14301f;--bad:#ff8f86;--warn:#f0b955;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mut{color:var(--mut);font-size:14px}
#n{font:600 34px var(--mono);letter-spacing:2px;text-align:center;padding:14px;border:2px solid var(--acc);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
#n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{appearance:none;border:0;background:var(--acc);color:var(--acc-fg);font:600 18px system-ui,sans-serif;padding:16px;border-radius:10px;width:100%;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);font-size:14px;padding:9px 12px;width:auto}
#res{display:none;border-radius:10px;padding:18px;flex-direction:column;gap:4px}
#res.show{display:flex}#res b{font-size:26px;line-height:1.15}#res span{font-size:15px}
#res.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
#res.bad{background:var(--bad);color:#fff}
#res.warn{background:var(--warn);color:#fff}
.stats{display:flex;gap:16px;flex-wrap:wrap}.stats div{flex:1;min-width:100px}.stats b{display:block;font:600 22px var(--mono)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.row:last-child{border-bottom:0}.row .num{font:600 18px var(--mono)}
.tag{font:600 12px system-ui;padding:2px 9px;border-radius:99px;white-space:nowrap}.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--bad);color:#fff}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.miss{max-height:240px;overflow:auto}.miss div{display:flex;justify-content:space-between;font:14px var(--mono);border-bottom:1px solid var(--line);padding:4px 0}
details summary{cursor:pointer;color:var(--acc);font-weight:600}
</style></head><body>
<main>
<header><h1>Conferência de NF</h1><p class="mut">Digite só o número da NF e toque em Conferir (ou Enter). Ex.: 9236</p></header>
<section class="card">
<input id="n" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Nº da NF" aria-label="Número da NF" autofocus>
<button class="btn" id="go">Conferir</button>
</section>
<section id="res" role="alert" aria-live="assertive"></section>
<section class="card">
<div class="hd"><h2>Progresso</h2><span class="mut" id="pt"></span></div><div class="bar"><i id="bi"></i></div>
<div class="stats"><div><span class="mut">Conferidas</span><b id="s1">0</b></div><div><span class="mut">Canceladas</span><b id="s2">0</b></div><div><span class="mut">Fora de lista</span><b id="s3">0</b></div></div>
</section>
<section class="card">
<div class="hd"><h2>Conferidas</h2><div style="display:flex;gap:8px"><button class="btn sec" id="exp">Exportar CSV</button><button class="btn sec" id="clr">Limpar</button></div></div>
<div id="list"><p class="mut">Nenhuma nota conferida ainda.</p></div>
</section>
<section class="card"><details><summary>Cancelamentos que ainda faltam conferir</summary><div class="miss" id="miss"></div></details></section>
</main>
<script>
const NF={"9236":"ML","9208":"ML","9188":"ML","9155":"ML","9058":"ML","8951":"ML","8854":"ML","8791":"ML","8767":"ML","8748":"ML","8747":"ML","8683":"ML","8629":"ML","8557":"ML","8542":"ML","8492":"ML","8310":"ML","8142":"ML","8134":"ML","8131":"ML","8120":"ML","8018":"ML","7937":"ML","7900":"ML","7678":"Shopee","7731":"Shopee","7787":"Shopee","7796":"Shopee","7872":"Shopee","7874":"Shopee","7875":"Shopee","8021":"Shopee","8105":"Shopee","8121":"Shopee","8123":"Shopee","8136":"Shopee","8138":"Shopee","8140":"Shopee","8141":"Shopee","8143":"Shopee","8146":"Shopee","8148":"Shopee","8149":"Shopee","8152":"Shopee","8244":"Shopee","8235":"Shopee","8268":"Shopee","8420":"Shopee","8422":"Shopee","8428":"Shopee","8485":"Shopee","8584":"Shopee","8686":"Shopee","8924":"Shopee","8989":"Shopee","8997":"Shopee","8920":"Shopee","9134":"Shopee","9138":"Shopee","9220":"Shopee","9223":"Shopee","9269":"Shopee","9292":"Shopee","9379":"Shopee","9391":"Shopee","7842":"ML","7846":"ML","7912":"ML","7926":"ML","8108":"ML","8333":"ML","8362":"ML","8414":"ML","8466":"ML","8514":"ML","8543":"ML","8661":"ML","8693":"ML","8729":"ML","8826":"ML","8829":"ML","8870":"ML","8900":"ML","9132":"ML","9183":"ML","9195":"ML","9426":"ML"};
const KEY="nfconf.v1";let recs=[];
try{recs=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs))}catch(e){}};
function beep(ok){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:200;g.gain.value=.15;o.start();o.stop(a.currentTime+(ok?.12:.5))}catch(e){}try{navigator.vibrate&&navigator.vibrate(ok?60:[200,100,200])}catch(e){}}
function flash(c,t,s){const r=$("res");r.className="show "+c;r.innerHTML="<b>"+t+"</b><span>"+s+"</span>"}
function check(){
 const raw=$("n").value.replace(/\D/g,"");$("n").value="";$("n").focus();
 if(!raw){flash("warn","TENTE NOVAMENTE","Digite o número da NF (só números).");beep(false);return}
 const num=String(parseInt(raw,10));const m=NF[num];const dup=recs.find(r=>r.n===num);
 if(!dup){recs.unshift({n:num,m:m||"",t:Date.now()});save()}
 if(m)flash("ok","DEU CERTO · NF "+num,(dup?"Já conferida. ":"")+"Nota de pedido cancelado ("+m+").");
 else flash("bad","NOTA FORA DE LISTA","NF "+num+" não é de pedido cancelado. Não rasgue essa nota.");
 beep(!!m);render()}
function render(){
 const hit=recs.filter(r=>r.m).length,tot=Object.keys(NF).length,got=new Set(recs.filter(r=>r.m).map(r=>r.n));
 $("s1").textContent=recs.length;$("s2").textContent=hit;$("s3").textContent=recs.length-hit;
 $("pt").textContent=got.size+" de "+tot+" canceladas";$("bi").style.width=(100*got.size/tot)+"%";
 $("list").innerHTML=recs.length?recs.map(r=>'<div class="row"><span class="num">NF '+r.n+'</span><span class="tag '+(r.m?'t-ok':'t-bad')+'">'+(r.m?r.m+" · cancelada":"FORA DE LISTA")+'</span></div>').join(""):'<p class="mut">Nenhuma nota conferida ainda.</p>';
 const miss=Object.keys(NF).filter(n=>!got.has(n)).sort((a,b)=>a-b);
 $("miss").innerHTML=miss.length?miss.map(n=>"<div><span>NF "+n+"</span><span>"+NF[n]+"</span></div>").join(""):'<p class="mut">Tudo conferido.</p>'}
$("go").onclick=check;$("n").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});
$("clr").onclick=()=>{const b=$("clr");if(b.dataset.a){recs=[];save();render();$("res").className="";delete b.dataset.a;b.textContent="Limpar"}else{b.dataset.a=1;b.textContent="Confirmar limpar";setTimeout(()=>{delete b.dataset.a;b.textContent="Limpar"},4000)}};
$("exp").onclick=()=>{const rows=[["numero_nf","marketplace","situacao"]].concat(recs.slice().reverse().map(r=>[r.n,r.m,r.m?"cancelada":"fora da lista"]));
 const csv="﻿"+rows.map(x=>x.join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="nf_conferidas.csv";document.body.appendChild(a);a.click();a.remove()};
render();
</script></body></html>
